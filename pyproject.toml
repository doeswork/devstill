[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devstill"
version = "0.1.0"
description = "Local AI-first repository intelligence and code search TUI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "chromadb>=1,<2",
    "huggingface-hub>=0.34,<2",
    "numpy<3",
    "orjson>=3.10,<4",
    "pydantic>=2.7,<3",
    "python-dotenv>=1,<2",
    "rapidfuzz>=3,<4",
    "rich>=13,<15",
    "sentence-transformers>=5,<6",
    "textual[syntax]>=5,<8",
    "transformers>=4.56,<5",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "watchdog>=4,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
devstill = "devstill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
