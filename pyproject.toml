[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devstill"
version = "0.1.0"
description = "Local AI-first repository intelligence and code search TUI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "chromadb>=1,<2",
    "huggingface-hub>=0.34,<2",
    "httpx>=0.28,<1",
    "numpy<3",
    "orjson>=3.10,<4",
    "packaging>=24,<27",
    "pydantic>=2.7,<3",
    "python-dotenv>=1,<2",
    "rapidfuzz>=3,<4",
    "rich>=13,<15",
    "sentence-transformers>=5,<6",
    "textual[syntax]>=5,<8",
    "transformers>=4.56,<5",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-bash>=0.25.1,<0.26",
    "tree-sitter-css>=0.25,<0.26",
    "tree-sitter-go>=0.25,<0.26",
    "tree-sitter-html>=0.23.2,<0.24",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-ruby>=0.23.1,<0.24",
    "tree-sitter-rust>=0.24.2,<0.25",
    "tree-sitter-sql>=0.3.11,<0.4",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "watchdog>=4,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
devstill = "devstill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devstill = ["pi/*.ts"]

[tool.pytest.ini_options]
markers = [
    "cuda: requires a CUDA-capable PyTorch installation and NVIDIA GPU",
]
