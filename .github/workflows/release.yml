name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          if not re.fullmatch(r"\d+\.\d+\.\d+", tag):
              raise SystemExit("automatic releases require a stable vMAJOR.MINOR.PATCH tag")
          if tag != package:
              raise SystemExit(f"tag {tag} does not match package version {package}")
          PY
      - name: Install and test CPU release
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[dev]"
          python -m pip check
          pytest -m "not cuda"
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
